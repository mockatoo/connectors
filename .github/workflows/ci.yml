name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm docs:check
      # Pack each connector and typecheck an npm consumer on
      # "moduleResolution": "node", which ignores `exports`.
      - run: pnpm packed:check
  # The connector's compatibility floor is @auth/core 0.37.1, the version
  # bundled by next-auth 5.0.0-beta.23, the lowest next-auth tested here.
  # Check that lowest beta and the newest one on npm.
  authjs-next-auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next-auth: [5.0.0-beta.23, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install next-auth ${{ matrix.next-auth }} and its @auth/core
        env:
          NEXT_AUTH: ${{ matrix.next-auth }}
        run: |
          version="$(npm view "next-auth@$NEXT_AUTH" version)"
          core="$(npm view "next-auth@$version" 'dependencies.@auth/core')"
          echo "next-auth $version, @auth/core $core"
          pnpm --filter @mockatoo/connect-authjs add -D "next-auth@$version" "@auth/core@$core"
      - run: pnpm --filter @mockatoo/connect-authjs typecheck
      - run: pnpm vitest run packages/connect-authjs
  # A plain npm consumer installs the packed connector next to next-auth with
  # no explicit @auth/core, so npm must reuse next-auth's copy. A required
  # peer instead installs a second @auth/core whose symbols don't typecheck
  # against next-auth's, so prove the packed artifact under that topology.
  authjs-packed-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mockatoo/connect-authjs build
      - run: pnpm --dir packages/connect-authjs pack --pack-destination "$RUNNER_TEMP"
      - name: Consume the tarball with npm and next-auth only
        run: |
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y
          npm install "$RUNNER_TEMP"/mockatoo-connect-authjs-*.tgz next-auth@5.0.0-beta.23 typescript
          npm ls @auth/core
          versions="$(npm ls @auth/core | grep -o '@auth/core@[0-9.]*' | sort -u)"
          test "$versions" = '@auth/core@0.37.1' || {
            echo "Expected one @auth/core@0.37.1 (next-auth's), got:" "$versions"
            exit 1
          }
          cat > tsconfig.json <<'TSCONFIG'
          {
            "compilerOptions": {
              "target": "es2022",
              "lib": ["es2023", "dom", "dom.iterable"],
              "module": "esnext",
              "moduleResolution": "bundler",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true
            },
            "include": ["auth.ts"]
          }
          TSCONFIG
          cat > auth.ts <<'AUTH'
          import NextAuth, { customFetch } from "next-auth";
          import { MockGitHub, MockGoogle } from "@mockatoo/connect-authjs";

          export const { handlers, auth, signIn, signOut } = NextAuth({
            providers: [
              MockGoogle({ [customFetch]: fetch as typeof fetch }),
              MockGitHub({ [customFetch]: fetch as typeof fetch }),
            ],
          });
          AUTH
          npx tsc --noEmit
  # @auth/core 0.37.1 is the dependency of next-auth 5.0.0-beta.23, the
  # lowest version supported by the connector's peer range.
  authjs-sveltekit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sveltekit: [latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install @auth/sveltekit ${{ matrix.sveltekit }} and its @auth/core
        env:
          AUTH_SVELTEKIT: ${{ matrix.sveltekit }}
        run: |
          version="$(npm view "@auth/sveltekit@$AUTH_SVELTEKIT" version --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v.at(-1):v)})')"
          core="$(npm view "@auth/sveltekit@$version" 'dependencies.@auth/core')"
          echo "@auth/sveltekit $version, @auth/core $core"
          # Remove next-auth from devDependencies only: `pnpm remove` would
          # strip it from peerDependencies too, hiding a metadata mistake.
          (cd packages/connect-authjs && npm pkg delete devDependencies.next-auth)
          pnpm --dir packages/connect-authjs pack --pack-destination "$RUNNER_TEMP"
          tar -xOf "$RUNNER_TEMP"/mockatoo-connect-authjs-*.tgz package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const offenders = ["dependencies", "peerDependencies"].filter(
              (section) => pkg[section] && pkg[section]["next-auth"],
            );
            if (offenders.length) {
              console.error(`packed package.json lists next-auth in ${offenders.join(", ")}`);
              process.exit(1);
            }
          '
          pnpm --filter @mockatoo/connect-authjs add -D "@auth/sveltekit@$version" "@auth/core@$core"
      - run: pnpm --filter @mockatoo/connect-authjs typecheck
      - run: pnpm vitest run packages/connect-authjs
  # The Better Auth connector supports better-auth ^1.4.15 (its peer range).
  # Check the floor, the newest release of each 1.x minor line, and latest.
  better-auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        better-auth: [1.4.15, "~1.4", "~1.5", "~1.6", "~1.7", latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install better-auth ${{ matrix.better-auth }}
        env:
          BETTER_AUTH: ${{ matrix.better-auth }}
        run: |
          version="$(npm view "better-auth@$BETTER_AUTH" version --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v.at(-1):v)})')"
          echo "better-auth $version"
          pnpm --filter @mockatoo/connect-better-auth add -D "better-auth@$version"
      - run: pnpm --filter @mockatoo/connect-better-auth typecheck
      - run: pnpm --filter @mockatoo/connect-better-auth build
      - run: pnpm vitest run packages/connect-better-auth
